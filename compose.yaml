name: ros2
services:
  mapping:
    image: local/ros2-robot:jazzy
    build:
      context: .
      args:
        ROS_BASE: ${ROS_BASE:-ros:jazzy-ros-base-noble}
    restart: unless-stopped
    init: true
    network_mode: host
    devices:
      - /dev/lidar:/dev/lidar
      - ${GPIO_DEVICE:-/dev/gpiochip4}:/dev/gpiochip4
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      ARDUINO_IP: ${ARDUINO_IP:-}
      ARDUINO_PORT: ${ARDUINO_PORT:-4210}
      ARDUINO_LOCAL_PORT: ${ARDUINO_LOCAL_PORT:-4211}
      DRIVE_WHEEL_BASE_M: ${DRIVE_WHEEL_BASE_M:-0.32}
      DRIVE_MAX_LINEAR_MPS: ${DRIVE_MAX_LINEAR_MPS:-0.5}
      CMD_VEL_TIMEOUT_SEC: ${CMD_VEL_TIMEOUT_SEC:-0.5}
      LIDAR_SERIAL_PORT: ${LIDAR_SERIAL_PORT:-/dev/lidar}
      LIDAR_FRAME: ${LIDAR_FRAME:-laser}
      LIDAR_X_M: ${LIDAR_X_M:-0.0}
      LIDAR_Y_M: ${LIDAR_Y_M:-0.0}
      LIDAR_Z_M: ${LIDAR_Z_M:-0.0}
      LIDAR_YAW_RAD: ${LIDAR_YAW_RAD:-0.0}
      LIDAR_MIN_RANGE_M: ${LIDAR_MIN_RANGE_M:-0.15}
      LIDAR_MAX_RANGE_M: ${LIDAR_MAX_RANGE_M:-8.0}
      GPIO_CHIP: ${GPIO_CHIP:-4}
      LEFT_ENCODER_A_BCM: ${LEFT_ENCODER_A_BCM:-17}
      LEFT_ENCODER_B_BCM: ${LEFT_ENCODER_B_BCM:-18}
      RIGHT_ENCODER_A_BCM: ${RIGHT_ENCODER_A_BCM:-22}
      RIGHT_ENCODER_B_BCM: ${RIGHT_ENCODER_B_BCM:-23}
      ENCODER_TICKS_PER_REV: ${ENCODER_TICKS_PER_REV:-240}
      DRIVE_WHEEL_RADIUS_M: ${DRIVE_WHEEL_RADIUS_M:-0.05}
      LEFT_ENCODER_SIGN: ${LEFT_ENCODER_SIGN:-1}
      RIGHT_ENCODER_SIGN: ${RIGHT_ENCODER_SIGN:-1}
      ODOM_PUBLISH_RATE_HZ: ${ODOM_PUBLISH_RATE_HZ:-50}
      ODOM_FRAME: ${ODOM_FRAME:-odom}
      BASE_FRAME: ${BASE_FRAME:-base_link}
      TRACKER_MIN_RANGE_M: ${TRACKER_MIN_RANGE_M:-0.10}
      TRACKER_MAX_RANGE_M: ${TRACKER_MAX_RANGE_M:-3.0}
      TRACKER_FRONT_ARC_DEG: ${TRACKER_FRONT_ARC_DEG:-30}
      TRACKER_ASSOCIATION_DISTANCE_M: ${TRACKER_ASSOCIATION_DISTANCE_M:-0.60}
      TRACKER_TARGET_TIMEOUT_SEC: ${TRACKER_TARGET_TIMEOUT_SEC:-0.5}
      HUMAN_DETECTOR_MODEL: ${HUMAN_DETECTOR_MODEL:-/opt/robot/models/LFE-PPN.onnx}
      HUMAN_DETECTOR_SCORE_THRESHOLD: ${HUMAN_DETECTOR_SCORE_THRESHOLD:-0.937660}
      HUMAN_DETECTOR_SCAN_NEAR_M: ${HUMAN_DETECTOR_SCAN_NEAR_M:-0.02}
      HUMAN_DETECTOR_SCAN_FAR_M: ${HUMAN_DETECTOR_SCAN_FAR_M:-10.0}
      HUMAN_DETECTOR_THREADS: ${HUMAN_DETECTOR_THREADS:-2}
      FOLLOW_DISTANCE_M: ${FOLLOW_DISTANCE_M:-1.0}
      DRIVE_MAX_ANGULAR_RPS: ${DRIVE_MAX_ANGULAR_RPS:-1.0}
      FOLLOW_LINEAR_GAIN: ${FOLLOW_LINEAR_GAIN:-0.7}
      FOLLOW_ANGULAR_GAIN: ${FOLLOW_ANGULAR_GAIN:-1.5}
      OBSTACLE_STOP_DISTANCE_M: ${OBSTACLE_STOP_DISTANCE_M:-0.25}
      OBSTACLE_STOP_ARC_DEG: ${OBSTACLE_STOP_ARC_DEG:-25}
      FOLLOW_DATA_TIMEOUT_SEC: ${FOLLOW_DATA_TIMEOUT_SEC:-0.5}
      MAP_FRAME: ${MAP_FRAME:-map}
      BREADCRUMB_FILE: ${BREADCRUMB_FILE:-/maps/breadcrumbs.json}
      BREADCRUMB_SPACING_M: ${BREADCRUMB_SPACING_M:-0.25}
      BREADCRUMB_TURN_DEG: ${BREADCRUMB_TURN_DEG:-15}
      BACKTRACK_SPEED_MPS: ${BACKTRACK_SPEED_MPS:-0.20}
      BACKTRACK_ANGULAR_GAIN: ${BACKTRACK_ANGULAR_GAIN:-1.5}
      BACKTRACK_GOAL_TOLERANCE_M: ${BACKTRACK_GOAL_TOLERANCE_M:-0.20}
      BUTTON_A_BCM: ${BUTTON_A_BCM:-5}
      BUTTON_B_BCM: ${BUTTON_B_BCM:-6}
      BUTTON_DEBOUNCE_SEC: ${BUTTON_DEBOUNCE_SEC:-0.05}
      SOS_HOLD_SEC: ${SOS_HOLD_SEC:-3.0}
    volumes:
      - ./config:/config:ro
      - ./maps:/maps
      - ./bags:/bags
    working_dir: /maps
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
